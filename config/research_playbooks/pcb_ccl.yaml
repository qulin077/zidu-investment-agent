monitoring_metrics:
  - AI服务器、交换机、汽车电子与消费电子出货
  - 板层数、面积、线宽线距、材料等级与单机价值量
  - 高频高速覆铜板、铜箔、玻纤布和树脂价格
  - 扩产进度、稼动率、良率、ASP 与交期
  - 客户认证、产品结构与海外产能
  - 代表公司订单、收入、毛利率、存货与资本开支
financial_validation:
  - 分产品收入、ASP、销量与毛利率
  - 稼动率、良率、在建工程和资本开支
  - 原材料涨价传导与存货周期
  - 应收账款、客户集中度与经营现金流
source_priorities: [公司公告与交流纪要, 下游服务器及交换机厂商指引, 行业协会, 原材料价格, 卖方预测]
